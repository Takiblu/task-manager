[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manjaro-task-manager"
version = "1.0.0"
description = "A modern, Manjaro-inspired Task Manager for Arch Linux and Arch-based distributions"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Taki", email = "you@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "psutil>=5.9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/Takiblu/task-manager"
Issues = "https://github.com/Takiblu/task-manager/issues"

[project.scripts]
manjaro-task-manager = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
